# Pi-hole v6 deployment
# Docs: docs/deployment-runbook.md, plan: docs/plans/2026-08-17-pihole-k3s-deployment.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  strategy:
    # ReadWriteOnce PVC cannot be shared by rolling-update pods
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      # Pin to k3s control-plane node (QNAP VM, always online)
      nodeSelector:
        kubernetes.io/hostname: k3s
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: pihole
          # v6 image, latest stable tag (verified via Docker Hub 2026-08-19)
          image: pihole/pihole:2026.07.2
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pihole-config
            - secretRef:
                name: pihole-webpassword
          resources:
            requests:
              cpu: 1m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
          securityContext:
            capabilities:
              add:
                # Bind port 53 as non-root; NET_ADMIN only needed for DHCP (not used here)
                - NET_BIND_SERVICE
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config
