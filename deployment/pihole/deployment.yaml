# Pi-hole v6 deployment
# See: docs/plans/2026-08-17-pihole-k3s-deployment.md (design.md)
# See: docs/deployment-runbook.md (apply / smoke-test)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
      annotations:
        # Reference: docs/plans/2026-08-17-pihole-k3s-deployment.md and docs/deployment-runbook.md
        pihole.gthieleb.de/docs: "design.md, deployment-runbook.md"
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: pihole
          image: pihole/pihole:2024.07.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pihole-config
            - secretRef:
                name: pihole-webpassword
          resources:
            requests:
              cpu: 1m
              memory: 64Mi
            limits:
              cpu: 50m
              memory: 128Mi
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: pihole-config
              mountPath: /etc/pihole
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: pihole-config
          persistentVolumeClaim:
            claimName: pihole-config