# Pi-hole Kustomization
#
# NOTE: secret.yaml is intentionally NOT part of the resources.
# Create the secret imperatively so the real password never enters git:
#   kubectl create secret generic pihole-webpassword -n pihole \
#     --from-literal=FTLCONF_webserver_api_password='<strong-pw>'
# (Key must be FTLCONF_webserver_api_password — Pi-hole v6 env syntax.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pihole
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
