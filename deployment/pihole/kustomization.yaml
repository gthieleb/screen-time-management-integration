# Pi-hole Kustomization
# NOTE: adjust the Secret before `kubectl apply -k` (see deployment-runbook.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pihole
resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml